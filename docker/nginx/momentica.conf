# Momentica — one hostname serves both halves:
#   /api/*  the backend API (this repo)
#   /*      the web renderer, which owns share links at /{8-char code}
# Share codes are always exactly 8 base62 characters, so they can never collide
# with /api, /health or /.well-known.
server {
    server_name momentica.ferbotz.com;

    # Photo uploads are capped at 8 MB in the app; headroom for the multipart envelope.
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---- API -------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Load-bearing: the app trusts this to rate-limit per client IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Ops endpoints, kept under /api/ so the root belongs entirely to the renderer.
    location = /api/health {
        proxy_pass http://127.0.0.1:8092/health;
        access_log off;
    }
    location = /api/health/db {
        proxy_pass http://127.0.0.1:8092/health/db;
        access_log off;
    }

    # ---- Renderer --------------------------------------------------------
    # Not deployed yet. When it is, this becomes its proxy_pass or root.
    location / {
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/momentica.ferbotz.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/momentica.ferbotz.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = momentica.ferbotz.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name momentica.ferbotz.com;
    return 404; # managed by Certbot


}