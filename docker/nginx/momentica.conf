# nginx site for the Momentica API.
#
# Certbot manages the certificate lines; run:
#   sudo certbot --nginx -d api.momentica.ferbotz.com

server {
    listen 80;
    server_name api.momentica.ferbotz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.momentica.ferbotz.com;

    ssl_certificate     /etc/letsencrypt/live/api.momentica.ferbotz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.momentica.ferbotz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Photo uploads are capped at 8 MB in the app; leave headroom for the
    # multipart envelope.
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Without this the app sees every request as coming from loopback and
        # all per-IP rate limits collapse into one shared bucket.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
